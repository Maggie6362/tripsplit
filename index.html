  <title>TripSplit 旅帳通 - 旅行記帳與分帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .btn-press:active {
      transform: scale(0.96);
      transition: transform 0.1s ease;
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between select-none">

  <!-- 頂部導航 -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-200/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-white shadow-md shadow-amber-200">
        <i class="fa-solid fa-wallet text-sm"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-slate-900 leading-tight">TripSplit 旅帳通</h1>
        <p class="text-xs text-slate-500">旅行記帳・多日行程・分帳</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openShareModal()" class="btn-press px-2.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-600 font-medium text-sm flex items-center space-x-1 border border-emerald-200">
        <i class="fa-brands fa-line text-sm"></i>
        <span>LINE 分享</span>
      </button>
      <button onclick="clearAllData()" class="btn-press p-2 rounded-lg text-slate-400 hover:text-rose-500" title="清空全部資料">
        <i class="fa-regular fa-trash-can text-sm"></i>
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4 pb-24">

    <!-- 多日行程選擇導航標籤 (Day Tabs) -->
    <div class="space-y-1.5">
      <div class="flex items-center justify-between px-1">
        <div class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center space-x-1">
          <i class="fa-regular fa-calendar-days text-indigo-500"></i>
          <span>行程天數選擇</span>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="addDay()" class="btn-press px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 text-xs font-semibold border border-indigo-200 py-1 px-2.5 hover:bg-indigo-100 flex items-center space-x-1">
            <i class="fa-solid fa-plus text-[10px]"></i>
            <span>增加天數</span>
          </button>
          <button onclick="deleteCurrentDay()" id="btnDeleteDay" class="btn-press px-2 py-0.5 rounded-md bg-rose-50 text-rose-600 text-xs font-semibold border border-rose-200 py-1 px-2.5 hover:bg-rose-100 hidden">
            刪除本天
          </button>
        </div>
      </div>
      
      <!-- 天數滑動列 -->
      <div id="dayTabsContainer" class="flex space-x-2 overflow-x-auto py-1 no-scrollbar">
        <!-- 動態渲染天數標籤 -->
      </div>
    </div>

    <!-- 儀表板卡片 -->
    <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-5 text-white shadow-xl shadow-slate-300 relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <!-- 統計範疇與幣別設定 -->
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-1.5">
          <span id="scopeBadge" class="bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 text-xs px-2.5 py-1 rounded-full font-medium">當前視角：全部天數</span>
        </div>
        <div class="flex items-center space-x-2">
          <select id="currencySelect" onchange="changeCurrency(this.value)" class="bg-white/10 text-white text-sm px-3 py-1.5 rounded-full outline-none border border-white/20">
            <option value="NT$" class="text-slate-800">NT$ (TWD)</option>
            <option value="¥" class="text-slate-800">¥ (JPY)</option>
            <option value="$" class="text-slate-800">$ (USD)</option>
            <option value="€" class="text-slate-800">€ (EUR)</option>
            <option value="₩" class="text-slate-800">₩ (KRW)</option>
            <option value="HK$" class="text-slate-800">HK$</option>
            <option value="฿" class="text-slate-800">฿ (THB)</option>
          </select>
        </div>
      </div>

      <!-- 總金額 -->
      <div class="mb-4">
        <div class="text-xs text-slate-300 font-medium mb-1" id="totalAmountLabel">總累計支出</div>
        <div class="text-4xl font-extrabold tracking-tight">
          <span id="currSymbol" class="text-2xl text-indigo-300 mr-1">NT$</span>
          <span id="totalAmount">0</span>
        </div>
      </div>

      <!-- 人數與每人應付 -->
      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/10">
        <!-- 旅伴人數 -->
        <div class="bg-white/5 rounded-2xl p-2.5 flex flex-col justify-between border border-white/5">
          <span class="text-xs text-slate-200 font-medium mb-1.5">分攤人數</span>
          <div class="flex items-center justify-between">
            <button onclick="updateMembers(-1)" class="btn-press w-8 h-8 rounded-full text-base bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm font-bold text-white">−</button>
            <span id="memberCount" class="text-xl font-bold">2</span>
            <button onclick="updateMembers(1)" class="btn-press w-8 h-8 rounded-full text-base bg-indigo-500 hover:bg-indigo-400 flex items-center justify-center text-sm font-bold text-white">+</button>
          </div>
        </div>

        <!-- 每人應付 -->
        <div class="bg-white/5 rounded-2xl p-2.5 flex flex-col justify-between border border-white/5">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-200 font-medium">每人應付</span>
            <select id="roundMode" onchange="renderDashboard()" class="bg-transparent text-xs text-indigo-300 outline-none">
              <option value="round" class="text-slate-800">四捨五入</option>
              <option value="ceil" class="text-slate-800">無條件進位</option>
              <option value="floor" class="text-slate-800">無條件捨去</option>
              <option value="exact" class="text-slate-800">保留小數</option>
            </select>
          </div>
          <div class="text-2xl font-bold text-amber-300 truncate">
            <span id="currSymbolSub" class="text-sm mr-1">NT$</span>
            <span id="perPersonAmount">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 記帳輸入卡片 -->
    <div class="glass-card rounded-2xl p-4 shadow-sm border border-slate-200/80">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center space-x-1.5">
          <i class="fa-solid fa-pen-to-square text-indigo-500"></i>
          <span>新增支出</span>
        </h2>
        <span id="formDayBadge" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md border border-indigo-100">
          歸屬：Day 1
        </span>
      </div>

      <form id="expenseForm" onsubmit="addExpense(event)" class="space-y-3">
        <!-- 歸屬行程天數選擇 -->
        <div>
          <label class="block text-xs text-slate-500 font-semibold mb-1">行程天數</label>
          <select id="inputDaySelect" class="w-full py-2.5 px-3 bg-slate-50 rounded-xl text-sm font-medium border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <!-- 動態生成天數選項 -->
          </select>
        </div>

        <!-- 金額與類別 -->
        <div class="grid grid-cols-5 gap-2">
          <div class="col-span-3">
            <label class="block text-xs text-slate-500 font-semibold mb-1">消費金額</label>
            <div class="relative">
              <span id="formCurrPrefix" class="absolute left-3 top-2.5 text-sm font-bold text-slate-500">NT$</span>
              <input type="number" id="inputAmount" step="any" inputmode="decimal" required placeholder="0" class="w-full pl-12 pr-3 py-2.5 bg-slate-50 rounded-xl text-slate-800 font-bold text-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
          <div class="col-span-2">
            <label class="block text-xs text-slate-500 font-semibold mb-1">分類</label>
            <select id="inputCategory" class="w-full py-2.5 px-2.5 bg-slate-50 rounded-xl text-sm font-medium border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="food">🍜 餐飲</option>
              <option value="traffic">🚅 交通</option>
              <option value="hotel">🏨 住宿</option>
              <option value="ticket">🎟️ 門票娛樂</option>
              <option value="shopping">🛍️ 購物</option>
              <option value="other">💡 其他</option>
            </select>
          </div>
        </div>

        <!-- 名稱項目與付款人 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-500 font-semibold mb-1">品項說明</label>
            <input type="text" id="inputTitle" required placeholder="例：晚餐居酒屋、新幹線車票" class="w-full px-3.5 py-2.5 bg-slate-50 rounded-xl text-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 font-semibold mb-1">付款人</label>
            <input type="text" id="inputPayer" placeholder="例：公費錢包、我" value="公費錢包" class="w-full px-3.5 py-2.5 bg-slate-50 rounded-xl text-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <button type="submit" class="btn-press w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md shadow-indigo-100 flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>記錄這筆開銷</span>
        </button>
      </form>
    </div>

    <!-- 分析圖表區塊 (有資料時才展開) -->
    <div id="chartSection" class="glass-card rounded-2xl p-4 shadow-sm border border-slate-200/80 hidden">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">支出分佈（<span id="chartDayLabel">全部</span>）</h3>
        <span id="chartTotalBadge" class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-600 font-medium"></span>
      </div>
      <div class="h-44 flex items-center justify-center">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <!-- 支出明細列表 -->
    <div class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <h3 class="text-sm font-bold text-slate-600 uppercase tracking-wider">
          消費明細 (<span id="recordCount">0</span>)
        </h3>
        <select id="filterCategory" onchange="renderExpenses()" class="bg-transparent text-xs text-indigo-600 font-bold outline-none">
          <option value="all">全部分類</option>
          <option value="food">🍜 餐飲</option>
          <option value="traffic">🚅 交通</option>
          <option value="hotel">🏨 住宿</option>
          <option value="ticket">🎟️ 門票娛樂</option>
          <option value="shopping">🛍️ 購物</option>
          <option value="other">💡 其他</option>
        </select>
      </div>

      <div id="expenseList" class="space-y-2">
        <!-- 動態渲染明細 -->
      </div>
    </div>

  </main>

  <!-- LINE 分享報告 Modal -->
  <div id="shareModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <div class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs">
            <i class="fa-brands fa-line"></i>
          </div>
          <h4 class="font-bold text-slate-900 text-base">LINE 請款與行程結算報告</h4>
        </div>
        <button onclick="closeShareModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div class="flex items-center space-x-2 mb-2">
        <span class="text-xs text-slate-600 font-semibold">匯出範圍：</span>
        <select id="shareScopeSelect" onchange="generateShareText()" class="text-xs bg-slate-100 border border-slate-200 rounded-lg px-2 py-1 outline-none text-slate-700 font-medium">
          <option value="all">全部行程總結算</option>
          <!-- 動態注入各日選項 -->
        </select>
      </div>
      <textarea id="shareTextPreview" readonly class="w-full flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono text-slate-700 leading-relaxed outline-none resize-none mb-3"></textarea>
      <div class="flex space-x-2">
        <button onclick="copyShareText()" class="btn-press flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-sm font-bold flex items-center justify-center space-x-1 shadow-md shadow-emerald-100">
          <i class="fa-regular fa-copy"></i>
          <span id="copyBtnText">一鍵複製報告</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = {
      food: { name: '餐飲', icon: '🍜', color: '#f97316' },
      traffic: { name: '交通', icon: '🚅', color: '#0ea5e9' },
      hotel: { name: '住宿', icon: '🏨', color: '#8b5cf6' },
      ticket: { name: '門票娛樂', icon: '🎟️', color: '#ec4899' },
      shopping: { name: '購物', icon: '🛍️', color: '#10b981' },
      other: { name: '其他', icon: '💡', color: '#64748b' }
    };

    let state = {
      currency: 'NT$',
      members: 2,
      roundMode: 'ceil',
      totalDays: 3,
      currentDayFilter: 0,
      expenses: []
    };

    let chartInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      document.getElementById('currencySelect').value = state.currency;
      document.getElementById('memberCount').textContent = state.members;
      document.getElementById('roundMode').value = state.roundMode;
      updateCurrencyLabels();
      renderDayTabs();
      renderDaySelectOptions();
      renderDashboard();
      renderExpenses();
      initChart();
    });

    function saveState() {
      localStorage.setItem('tripsplit_multi_data', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('tripsplit_multi_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
          if (!state.totalDays || state.totalDays < 1) state.totalDays = 3;
          state.expenses.forEach(item => {
            if (!item.day) item.day = 1;
          });
        } catch (e) {
          console.error(e);
        }
      }
    }

    function addDay() {
      state.totalDays += 1;
      state.currentDayFilter = state.totalDays;
      saveState();
      renderDayTabs();
      renderDaySelectOptions();
      renderDashboard();
      renderExpenses();
      updateChart();
    }

    function deleteCurrentDay() {
      if (state.currentDayFilter === 0) return;
      const targetDay = state.currentDayFilter;
      const count = state.expenses.filter(i => i.day === targetDay).length;
      
      const confirmMsg = count > 0 
        ? `確定要刪除 Day ${targetDay} 嗎？該天的 ${count} 筆記帳將一併刪除！`
        : `確定要刪除 Day ${targetDay} 嗎？`;

      if (confirm(confirmMsg)) {
        state.expenses = state.expenses.filter(i => i.day !== targetDay);
        state.expenses.forEach(i => {
          if (i.day > targetDay) i.day -= 1;
        });
        state.totalDays = Math.max(1, state.totalDays - 1);
        state.currentDayFilter = Math.min(targetDay, state.totalDays);
        saveState();
        renderDayTabs();
        renderDaySelectOptions();
        renderDashboard();
        renderExpenses();
        updateChart();
      }
    }

    function selectDay(dayNumber) {
      state.currentDayFilter = dayNumber;
      renderDayTabs();
      renderDashboard();
      renderExpenses();
      updateChart();
      
      const inputDaySelect = document.getElementById('inputDaySelect');
      if (dayNumber > 0 && inputDaySelect) {
        inputDaySelect.value = dayNumber;
        document.getElementById('formDayBadge').textContent = `歸屬：Day ${dayNumber}`;
      }
    }

    function renderDayTabs() {
      const container = document.getElementById('dayTabsContainer');
      const delBtn = document.getElementById('btnDeleteDay');
      
      if (state.currentDayFilter > 0 && state.totalDays > 1) {
        delBtn.classList.remove('hidden');
        delBtn.textContent = `刪除 Day ${state.currentDayFilter}`;
      } else {
        delBtn.classList.add('hidden');
      }

      let tabsHtml = '';
      const isAllActive = state.currentDayFilter === 0;
      tabsHtml += `
        <button onclick="selectDay(0)" class="btn-press px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all shadow-sm ${
          isAllActive 
            ? 'bg-slate-900 text-white shadow-slate-300' 
            : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200/80'
        }">
          全部天數
        </button>
      `;

      for (let d = 1; d <= state.totalDays; d++) {
        const isActive = state.currentDayFilter === d;
        const dayTotal = state.expenses.filter(i => i.day === d).reduce((s, i) => s + i.amount, 0);
        tabsHtml += `
          <button onclick="selectDay(${d})" class="btn-press px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all flex items-center space-x-1 shadow-sm ${
            isActive 
              ? 'bg-indigo-600 text-white shadow-indigo-200' 
              : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200/80'
          }">
            <span>Day ${d}</span>
            ${dayTotal > 0 ? `<span class="text-[10px] px-1.5 py-0.5 rounded-full ${isActive ? 'bg-indigo-800 text-indigo-100' : 'bg-slate-100 text-slate-500'}">${formatShortAmount(dayTotal)}</span>` : ''}
          </button>
        `;
      }

      container.innerHTML = tabsHtml;
    }

    function formatShortAmount(num) {
      if (num >= 10000) return (num / 1000).toFixed(0) + 'k';
      return num.toLocaleString();
    }

    function renderDaySelectOptions() {
      const select = document.getElementById('inputDaySelect');
      let options = '';
      for (let d = 1; d <= state.totalDays; d++) {
        options += `<option value="${d}">第 ${d} 天 (Day ${d})</option>`;
      }
      select.innerHTML = options;
      if (state.currentDayFilter > 0) {
        select.value = state.currentDayFilter;
        document.getElementById('formDayBadge').textContent = `歸屬：Day ${state.currentDayFilter}`;
      } else {
        select.value = 1;
        document.getElementById('formDayBadge').textContent = `歸屬：Day 1`;
      }

      select.onchange = (e) => {
        document.getElementById('formDayBadge').textContent = `歸屬：Day ${e.target.value}`;
      };
    }

    function updateMembers(delta) {
      const next = state.members + delta;
      if (next >= 1) {
        state.members = next;
        document.getElementById('memberCount').textContent = next;
        saveState();
        renderDashboard();
      }
    }

    function changeCurrency(val) {
      state.currency = val;
      updateCurrencyLabels();
      saveState();
      renderDashboard();
      renderExpenses();
    }

    function updateCurrencyLabels() {
      document.getElementById('currSymbol').textContent = state.currency;
      document.getElementById('currSymbolSub').textContent = state.currency;
      document.getElementById('formCurrPrefix').textContent = state.currency;
    }

    function getCurrentExpenses() {
      if (state.currentDayFilter === 0) {
        return state.expenses;
      }
      return state.expenses.filter(i => i.day === state.currentDayFilter);
    }

    function addExpense(e) {
      e.preventDefault();
      const amountInput = document.getElementById('inputAmount');
      const titleInput = document.getElementById('inputTitle');
      const catInput = document.getElementById('inputCategory');
      const payerInput = document.getElementById('inputPayer');
      const daySelect = document.getElementById('inputDaySelect');

      const amount = parseFloat(amountInput.value);
      if (isNaN(amount) || amount <= 0) return;

      const chosenDay = parseInt(daySelect.value) || 1;

      const newExpense = {
        id: Date.now().toString(),
        day: chosenDay,
        title: titleInput.value.trim() || '未命名消費',
        amount: amount,
        category: catInput.value,
        payer: payerInput.value.trim() || '公費錢包',
        date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      };

      state.expenses.unshift(newExpense);
      saveState();

      amountInput.value = '';
      titleInput.value = '';
      amountInput.blur();

      renderDayTabs();
      renderDashboard();
      renderExpenses();
      updateChart();
    }

    function deleteExpense(id) {
      if (confirm('確定要刪除這筆開銷嗎？')) {
        state.expenses = state.expenses.filter(item => item.id !== id);
        saveState();
        renderDayTabs();
        renderDashboard();
        renderExpenses();
        updateChart();
      }
    }

    function clearAllData() {
      if (confirm('確定要清空所有行程與記帳資料嗎？（此動作無法復原）')) {
        state.expenses = [];
        state.totalDays = 3;
        state.currentDayFilter = 0;
        saveState();
        renderDayTabs();
        renderDaySelectOptions();
        renderDashboard();
        renderExpenses();
        updateChart();
      }
    }

    function renderDashboard() {
      state.roundMode = document.getElementById('roundMode').value;
      const activeList = getCurrentExpenses();
      const total = activeList.reduce((sum, item) => sum + item.amount, 0);
      document.getElementById('totalAmount').textContent = total.toLocaleString('zh-TW');

      const scopeBadge = document.getElementById('scopeBadge');
      const totalAmountLabel = document.getElementById('totalAmountLabel');
      if (state.currentDayFilter === 0) {
        scopeBadge.textContent = '當前視角：全部天數總覽';
        totalAmountLabel.textContent = '全行程累計總支出';
      } else {
        scopeBadge.textContent = `當前視角：第 ${state.currentDayFilter} 天 (Day ${state.currentDayFilter})`;
        totalAmountLabel.textContent = `Day ${state.currentDayFilter} 當日總支出`;
      }

      let perPerson = total / (state.members || 1);
      let displayPerPerson = 0;

      if (state.roundMode === 'ceil') {
        displayPerPerson = Math.ceil(perPerson);
      } else if (state.roundMode === 'floor') {
        displayPerPerson = Math.floor(perPerson);
      } else if (state.roundMode === 'round') {
        displayPerPerson = Math.round(perPerson);
      } else {
        displayPerPerson = perPerson.toFixed(1);
      }

      document.getElementById('perPersonAmount').textContent = displayPerPerson.toLocaleString('zh-TW');
      document.getElementById('recordCount').textContent = activeList.length;
    }

    function renderExpenses() {
      const container = document.getElementById('expenseList');
      const catFilter = document.getElementById('filterCategory').value;
      let list = getCurrentExpenses();

      if (catFilter !== 'all') {
        list = list.filter(i => i.category === catFilter);
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-400 bg-white/60 rounded-2xl border border-dashed border-slate-200">
            <i class="fa-regular fa-clipboard text-2xl mb-2 opacity-50"></i>
            <p class="text-xs">${state.currentDayFilter === 0 ? '目前尚無支出記錄' : `Day ${state.currentDayFilter} 尚無支出記錄`}，快記上一筆吧！</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => {
        const cat = CATEGORIES[item.category] || CATEGORIES.other;
        return `
          <div class="glass-card rounded-2xl p-3.5 flex items-center justify-between border border-slate-200/70 shadow-sm">
            <div class="flex items-center space-x-3 overflow-hidden">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg bg-slate-50 border border-slate-100 flex-shrink-0">
                ${cat.icon}
              </div>
              <div class="min-w-0">
                <div class="flex items-center space-x-1.5">
                  <span class="text-xs font-bold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded border border-indigo-100 flex-shrink-0">D${item.day}</span>
                  <div class="font-bold text-sm font-bold text-slate-800 truncate">${escapeHtml(item.title)}</div>
                </div>
                <div class="text-xs text-slate-400 flex items-center space-x-1.5 mt-1">
                  <span>${escapeHtml(item.payer)}</span>
                  <span>•</span>
                  <span>${item.date}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center space-x-3 flex-shrink-0">
              <div class="text-right">
                <div class="font-bold text-base font-extrabold text-slate-900">${state.currency} ${item.amount.toLocaleString()}</div>
                <div class="text-xs text-slate-400 font-medium">${cat.name}</div>
              </div>
              <button onclick="deleteExpense('${item.id}')" class="btn-press text-slate-300 hover:text-rose-500 p-1">
                <i class="fa-solid fa-xmark text-xs"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function initChart() {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: [],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                boxWidth: 10,
                font: { size: 10 }
              }
            }
          },
          cutout: '70%'
        }
      });
      updateChart();
    }

    function updateChart() {
      const section = document.getElementById('chartSection');
      const activeList = getCurrentExpenses();

      if (activeList.length === 0) {
        section.classList.add('hidden');
        return;
      }
      section.classList.remove('hidden');

      const chartDayLabel = document.getElementById('chartDayLabel');
      chartDayLabel.textContent = state.currentDayFilter === 0 ? '全部天數' : `Day ${state.currentDayFilter}`;

      const sums = {};
      activeList.forEach(i => {
        sums[i.category] = (sums[i.category] || 0) + i.amount;
      });

      const labels = [];
      const data = [];
      const colors = [];

      Object.keys(sums).forEach(key => {
        if (sums[key] > 0) {
          labels.push(CATEGORIES[key].name);
          data.push(sums[key]);
          colors.push(CATEGORIES[key].color);
        }
      });

      chartInstance.data.labels = labels;
      chartInstance.data.datasets[0].data = data;
      chartInstance.data.datasets[0].backgroundColor = colors;
      chartInstance.update();
    }

    function openShareModal() {
      const select = document.getElementById('shareScopeSelect');
      let options = `<option value="all">全部行程總結算 (Day 1 ~ Day ${state.totalDays})</option>`;
      for (let d = 1; d <= state.totalDays; d++) {
        options += `<option value="${d}">僅 Day ${d} 結算</option>`;
      }
      select.innerHTML = options;
      select.value = state.currentDayFilter === 0 ? 'all' : state.currentDayFilter.toString();

      generateShareText();
      document.getElementById('shareModal').classList.remove('hidden');
      document.getElementById('shareModal').classList.add('flex');
    }

    function generateShareText() {
      const scope = document.getElementById('shareScopeSelect').value;
      let targetExpenses = [];
      let headerTitle = '';

      if (scope === 'all') {
        targetExpenses = state.expenses;
        headerTitle = `✈️【旅行記帳・全行程結算清單】`;
      } else {
        const d = parseInt(scope);
        targetExpenses = state.expenses.filter(i => i.day === d);
        headerTitle = `✈️【旅行記帳・Day ${d} 當日結算清單】`;
      }

      const total = targetExpenses.reduce((sum, item) => sum + item.amount, 0);
      let perPerson = total / (state.members || 1);
      if (state.roundMode === 'ceil') perPerson = Math.ceil(perPerson);
      else if (state.roundMode === 'floor') perPerson = Math.floor(perPerson);
      else if (state.roundMode === 'round') perPerson = Math.round(perPerson);
      else perPerson = perPerson.toFixed(1);

      let text = `${headerTitle}\n`;
      text += `---------------------------\n`;
      text += `💰 結算總額：${state.currency} ${total.toLocaleString()}\n`;
      text += `👥 分攤人數：${state.members} 人\n`;
      text += `👉 每人應付：${state.currency} ${perPerson.toLocaleString()}\n`;
      text += `---------------------------\n`;
      text += `📋 詳細消費明細：\n`;

      if (targetExpenses.length === 0) {
        text += `(尚無支出記錄)\n`;
      } else {
        if (scope === 'all') {
          for (let d = 1; d <= state.totalDays; d++) {
            const dayItems = targetExpenses.filter(i => i.day === d);
            if (dayItems.length > 0) {
              const daySubtotal = dayItems.reduce((s, i) => s + i.amount, 0);
              text += `\n【Day ${d}】(小計: ${state.currency} ${daySubtotal.toLocaleString()})\n`;
              dayItems.forEach((item, idx) => {
                const cat = CATEGORIES[item.category] || CATEGORIES.other;
                text += `  • [${cat.name}] ${item.title} : ${state.currency} ${item.amount.toLocaleString()} (${item.payer})\n`;
              });
            }
          }
        } else {
          targetExpenses.forEach((item, idx) => {
            const cat = CATEGORIES[item.category] || CATEGORIES.other;
            text += `${idx + 1}. [${cat.name}] ${item.title} : ${state.currency} ${item.amount.toLocaleString()} (${item.payer})\n`;
          });
        }
      }

      text += `\n結算生成於 TripSplit 旅帳通`;
      document.getElementById('shareTextPreview').value = text;
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.add('hidden');
      document.getElementById('shareModal').classList.remove('flex');
    }

    function copyShareText() {
      const textarea = document.getElementById('shareTextPreview');
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(textarea.value).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.textContent = '已成功複製！';
        setTimeout(() => {
          btnText.textContent = '一鍵複製報告';
          closeShareModal();
        }, 1200);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
