<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="旅帳通">
  <!-- 自訂 3D 黏土療癒風 iPhone 桌面專屬圖示 (Apple Touch Icon) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/image.png">
  <title>TripSplit 旅帳通 - 日系手帳・多日行程分帳</title>
  <link rel="stylesheet" href="assets/utilities.css">
  <script src="assets/chart.umd.js" defer></script>
  <style>
    :root {
      --bg-paper: #FAF4EB;
      --bg-bento-sub: #FAF4EB;
      --card-surface: #FFFFFF;
      --caramel-base: #B88D76;
      --caramel-deep: #754936;
      --caramel-soft: #E5C7B1;
      --khaki-base: #B88D76;
      --clay-peach: #E5C7B1;
      --text-primary: #4D463C;
      --text-secondary: #806B5D;
      --border-hairline: #E9D9CA;
      --border-dashed: #E9D9CA;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      /* UI-03 極輕手帳方格點陣紙感 */
      background-image:
        radial-gradient(rgba(184, 141, 118, 0.22) 1px, transparent 1px),
        linear-gradient(180deg, rgba(250, 244, 235, 0.96) 0%, rgba(250, 244, 235, 0.96) 100%);
      background-size: 18px 18px, 100% 100%;
    }

    /* UI-03 紙感頂部導覽列 */
    .techo-header {
      background: rgba(250, 244, 235, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hairline);
    }

    /* UI-02 Bento 便當格主卡片 (圓角 20px + 細邊框 + 柔和紙張層次) */
    .bento-box {
      background-color: var(--card-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 20px;
      box-shadow: 0 6px 20px -4px rgba(77, 70, 60, 0.05), 0 2px 6px -1px rgba(77, 70, 60, 0.03);
    }

    /* UI-02 Bento 內部次級便當格 (圓角 16px) */
    .bento-cell {
      background-color: var(--bg-bento-sub);
      border: 1px solid rgba(210, 183, 154, 0.38);
      border-radius: 16px;
    }

    /* UI-03 手帳紙膠帶標籤 (Washi Tape) */
    .washi-badge {
      background: linear-gradient(135deg, rgba(210, 183, 154, 0.28) 0%, rgba(184, 141, 118, 0.22) 100%);
      border-left: 2.5px dashed var(--khaki-base);
      border-right: 2.5px dashed var(--khaki-base);
      color: var(--text-primary);
    }

    /* UI-03 手帳細分隔虛線 */
    .techo-divider {
      border-top: 1.5px dashed var(--border-dashed);
    }

    /* UI-01 3D 黏土療癒風圖示容器 (純去背無框、直接浮動呈現 3D 黏土實體、微立體陰影) */
    .clay-icon {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: visible !important;
      position: relative;
    }

    .clay-icon-sm {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: visible !important;
      position: relative;
    }

    .clay-icon img,
    .clay-icon-sm img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 4px 6px rgba(101, 78, 67, 0.16));
      transition: transform 0.15s ease;
    }

    .clay-cat-btn:hover .clay-icon-sm img,
    .clay-cat-btn.active .clay-icon-sm img {
      transform: scale(1.12);
    }

    /* UI-01 3D 黏土分類快選便當格按鈕 */
    .clay-cat-btn {
      min-height: 72px;
      border-radius: 18px;
      background-color: var(--bg-bento-sub);
      border: 1.5px solid var(--border-hairline);
      transition: all 0.15s ease;
    }
    .clay-cat-btn.active {
      background-color: #E5C7B1;
      border-color: var(--caramel-deep);
      box-shadow: 0 0 0 2px rgba(117, 73, 54, 0.22), 0 6px 14px rgba(117, 73, 54, 0.12);
    }
    .clay-cat-btn.active .cat-title,
    .clay-cat-btn.active .cat-title + div {
      color: var(--caramel-deep) !important;
    }

    /* UI-01 3D 黏土圓形互動按鈕 (44x44px 觸控熱區) */
    .clay-round-btn {
      min-width: 44px;
      min-height: 44px;
      width: 44px;
      height: 44px;
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      box-shadow:
        inset 2px 2px 4px rgba(255, 255, 255, 0.9),
        inset -2px -2px 4px rgba(101, 78, 67, 0.16),
        0 4px 10px rgba(101, 78, 67, 0.12);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    /* UI-01 3D 黏土主要行動大按鈕 (高度 >= 50px，圓角 20px) */
    .clay-action-btn {
      min-height: 50px;
      border-radius: 20px;
      background: linear-gradient(145deg, #84553F 0%, #754936 100%);
      color: #FFFFFF;
      box-shadow:
        inset 2px 2px 4px rgba(255, 255, 255, 0.42),
        inset -2px -2px 5px rgba(75, 45, 34, 0.28),
        0 6px 14px rgba(117, 73, 54, 0.28);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    /* 手帳表單輸入框 (內文 16-18px，最小觸控高度 46px) */
    .techo-field {
      min-height: 46px;
      font-size: 16px;
      background-color: var(--bg-bento-sub);
      border: 1.5px solid var(--border-hairline);
      border-radius: 14px;
      color: var(--text-primary);
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .techo-field:focus {
      outline: none;
      background-color: #FFFFFF;
      border-color: var(--caramel-deep);
      box-shadow: 0 0 0 3px rgba(184, 141, 118, 0.28);
    }

    /* 按壓微互動與無障礙減少動態支援 */
    .btn-press {
      transition: transform 0.12s ease;
    }
    .btn-press:active {
      transform: scale(0.96);
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .btn-press:active {
        transform: none !important;
      }
    }

    [hidden] { display: none !important; }

    :focus-visible { outline: 2px solid var(--caramel-deep); outline-offset: 2px; }

    main {
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    .home-travel-banner {
      display: block;
      width: 100%;
      height: clamp(84px, 16vw, 140px);
      object-fit: cover;
      border: 1px solid var(--border-hairline);
      border-radius: 18px;
      background: var(--bg-paper);
    }

    @media (max-height: 700px) {
      .home-travel-banner { height: 60px; }
    }

    .bottom-nav {
      position: fixed;
      z-index: 40;
      inset: auto 0 0;
      padding: 5px max(8px, env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      background: var(--card-surface);
      border-top: 1px solid var(--border-hairline);
    }

    .bottom-nav-items {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      max-width: 36rem;
      margin: auto;
    }

    .bottom-nav button {
      display: grid;
      justify-items: center;
      align-content: center;
      min-height: 54px;
      border-radius: 12px;
      color: var(--caramel-deep);
      font-size: 14px;
      font-weight: 700;
    }

    .bottom-nav button[aria-current="page"] {
      background: var(--caramel-soft);
      box-shadow: inset 0 -3px var(--caramel-deep);
    }

    .bottom-nav img, .recent-expense img {
      width: 27px;
      height: 27px;
      object-fit: contain;
    }

    .recent-expense {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr) minmax(0, max-content);
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-top: 1px solid var(--border-hairline);
      font-size: 14px;
    }

    @media (max-width: 440px) {
      header h1 { font-size: 17px; }
    }

    @media (max-height: 700px) {
      #page-home > section { padding-block: 8px; }
      #page-home .recent-expense:nth-child(n+2) { display: none; }
      #page-home .clay-action-btn { min-height: 44px; }
      #page-home .bento-cell { padding-block: 4px; }
    }

    @media (max-height: 600px) {
      #page-home .bento-cell { padding-block: 2px; }
      #page-home .bento-cell .clay-icon-sm { width: 24px; height: 24px; }
      #page-home .bento-cell .clay-icon-sm + span { white-space: nowrap; }
      #page-home > section { padding-block: 4px; }
      #page-home .recent-expense { padding-block: 1px; }
    }

    .recent-expense strong { color: var(--caramel-deep); overflow-wrap: anywhere; }

    @media (max-width: 370px) {
      .recent-expense strong { max-width: 120px; }
      header .clay-icon { width: 34px; height: 34px; }
      header button span { white-space: nowrap; }
      header button { padding-inline: 7px; }
      header .clay-icon-sm { width: 18px; height: 18px; }
      header .brand-en { display: none; }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between select-none">

  <!-- 頂部導覽列 (UI-03 留白手帳感 + UI-01 3D 黏土主角圖示 icons/image.png) -->
  <header class="techo-header px-4 py-2">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center space-x-3">
        <!-- UI-01 3D 黏土療癒風錢包主角圖示 (icons/image.png) -->
        <div class="w-11 h-11 clay-icon flex-shrink-0">
          <img src="icons/image.png" alt="TripSplit 旅帳通錢包圖示">
        </div>
        <div>
          <!-- 標題 24px 大字體規範 -->
          <h1 class="text-[20px] font-extrabold text-[#4D463C] leading-tight tracking-tight"><span class="brand-en">TripSplit </span>旅帳通</h1>
        </div>
      </div>

      <!-- 頂部操作按鈕組 (皆符合 ≥ 44×44px 觸控標準，且保留完整文字標籤) -->
      <div class="flex items-center space-x-2">
        <button onclick="openShareModal()" class="btn-press min-h-[44px] px-3.5 py-2 rounded-2xl bg-[#E5C7B1] hover:bg-[#E9D9CA] text-[#754936] font-bold text-[16px] flex items-center space-x-2 border border-[#B88D76] shadow-sm">
          <span class="w-7 h-7 clay-icon-sm flex-shrink-0">
            <img src="icons/image6.png" alt="結算分享">
          </span>
          <span class="whitespace-nowrap">LINE 分享</span>
        </button>
        <button onclick="clearAllData()" class="btn-press min-w-[44px] min-h-[44px] px-2.5 py-2 rounded-2xl bg-[#FAF4EB] hover:bg-[#F5E6E0] text-[#806B5D] hover:text-[#913D2D] border border-[#E9D9CA] flex items-center space-x-1 text-[14px] font-bold" title="清空全部資料">
          <span aria-hidden="true" class="text-base">↺</span>
          <span class="hidden sm:inline">重置</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區：iPhone 單欄優先，iPad/桌面漸進擴展為 Bento 雙欄網格 -->
  <main class="flex-1 max-w-xl w-full mx-auto px-3 pt-2 space-y-2">

    <img id="homeTravelBanner" class="home-travel-banner" src="assets/home-travel-banner.jpg" width="1200" height="400" alt="">

    <!-- 區塊 1：多日行程手帳索引標籤 (Day Tabs Bento Bar + icons/image2.png) -->
    <section class="bento-box px-3 py-2" aria-label="行程天數切換">
      <div class="flex items-center justify-between gap-1">
        <div class="flex items-center space-x-2.5">
          <!-- UI-01 3D 黏土桌曆圖示 (icons/image2.png) -->
          <span class="w-8 h-8 clay-icon-sm flex-shrink-0">
            <img src="icons/image2.png" alt="行程天數桌曆圖示">
          </span>
          <span class="text-[16px] font-bold text-[#4D463C]">行程天數</span>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="addDay()" class="btn-press min-h-[44px] px-2 py-2 rounded-xl bg-[#E5C7B1] hover:bg-[#E9D9CA] text-[#754936] text-[15px] font-bold border border-[#B88D76] flex items-center space-x-1.5">
            <span aria-hidden="true" class="text-xs">+</span>
            <span>增加天數</span>
          </button>
          <button onclick="deleteCurrentDay()" id="btnDeleteDay" class="btn-press min-h-[44px] px-2 py-2 rounded-xl bg-[#F9EAE4] hover:bg-[#F4DCD3] text-[#913D2D] text-[15px] font-bold border border-[#EBCAC0] hidden">
            刪除本天
          </button>
        </div>
      </div>

      <!-- 天數滑動列 (手帳書籤感) -->
      <div id="dayTabsContainer" class="flex gap-2 overflow-x-auto no-scrollbar">
        <!-- 由 JS 動態渲染天數標籤 -->
      </div>
    </section>

    <div id="page-home" class="space-y-2">
        <section class="bento-box p-3" aria-label="支出分帳總覽">
          <div class="flex justify-between items-center gap-2">
            <span class="font-bold">總支出</span>
            <div class="relative">
              <label for="currencySelect" class="sr-only">選擇幣別</label>
              <select id="currencySelect" onchange="changeCurrency(this.value)" class="min-h-[44px] bg-[#FAF4EB] text-[#4D463C] text-[16px] font-bold pl-3.5 pr-8 py-2 rounded-xl outline-none border border-[#B88D76] focus:border-[#754936] appearance-none cursor-pointer">
                <option value="NT$">NT$ (TWD)</option>
                <option value="¥">¥ (JPY)</option>
                <option value="$">$ (USD)</option>
                <option value="€">€ (EUR)</option>
                <option value="₩">₩ (KRW)</option>
                <option value="HK$">HK$</option>
                <option value="฿">฿ (THB)</option>
              </select>
              <span aria-hidden="true" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-[#806B5D] pointer-events-none">⌄</span>
            </div>
          </div>

          <!-- 主 KPI 總額便當格 (搭配 icons/image3.png 3D 黏土口金包與金幣) -->
          <div class="px-1 mb-2 flex items-center justify-between gap-3">
            <div>
              <!-- 標題與大金額 (30px+) -->
              <div class="text-[32px] font-extrabold text-[#754936] min-w-0 break-all tracking-tight leading-none flex items-baseline">
                <span id="currSymbol" class="text-[22px] font-bold text-[#754936] mr-1.5">NT$</span>
                <span id="totalAmount">0</span>
              </div>
            </div>
            <!-- UI-01 3D 黏土口金包金幣圖示 (icons/image3.png) -->
            <div class="w-12 h-12 clay-icon flex-shrink-0">
              <img src="icons/image3.png" alt="總支出金幣包圖示">
            </div>
          </div>

          <!-- UI-02 雙欄 Bento 子卡片：分攤人數 & 每人應付 -->
          <div class="grid grid-cols-2 gap-2">
            <!-- 左格：分攤人數 (搭配 icons/image4.png 雙熊公仔與 44x44px 按鈕) -->
            <div class="bento-cell p-2 flex flex-col min-w-0 justify-between">
              <div class="flex items-center space-x-1 mb-1">
                <span class="w-8 h-8 clay-icon-sm flex-shrink-0">
                  <img src="icons/image4.png" alt="分攤旅伴小熊圖示">
                </span>
                <span class="text-[16px] text-[#4D463C] font-bold">分攤人數</span>
              </div>
              <div class="flex items-center justify-between">
                <button type="button" onclick="updateMembers(-1)" class="btn-press clay-round-btn bg-[#FFFFFF] text-[#4D463C] border border-[#E9D9CA]" aria-label="減少分攤人數">−</button>
                <span id="memberCount" class="text-[24px] font-extrabold text-[#4D463C]">2</span>
                <button type="button" onclick="updateMembers(1)" class="btn-press clay-round-btn text-white" style="background: linear-gradient(145deg, #84553F 0%, #754936 100%);" aria-label="增加分攤人數">+</button>
              </div>
            </div>

            <!-- 右格：每人應付金額與進位方式 -->
            <div class="bento-cell p-2 flex flex-col min-w-0 justify-between">
              <div class="flex flex-col items-start">
                <span class="text-[16px] text-[#4D463C] font-bold">每人應付</span>
                <select id="roundMode" onchange="renderDashboard(); saveState()" class="min-h-[44px] max-w-full bg-[#FFFFFF] px-2 py-1 rounded-lg border border-[#E9D9CA] text-[14px] text-[#754936] font-bold outline-none cursor-pointer" aria-label="分帳進位方式">
                  <option value="round">四捨五入</option>
                  <option value="ceil">無條件進位</option>
                  <option value="floor">無條件捨去</option>
                  <option value="exact">保留小數</option>
                </select>
              </div>
              <div class="text-[22px] font-extrabold text-[#754936] break-all leading-tight">
                <span id="currSymbolSub" class="text-[16px] font-bold mr-0.5">NT$</span>
                <span id="perPersonAmount">0</span>
              </div>
            </div>
          </div>
        </section>

      <button type="button" onclick="showPage('entry')" class="clay-action-btn btn-press w-full flex items-center justify-center gap-2 font-bold">
        <img class="w-8 h-8 object-contain" src="icons/image5.png" alt="">新增記帳
      </button>
      <section class="bento-box px-3 py-2" aria-labelledby="recentTitle">
        <div class="flex items-center justify-between">
          <h2 id="recentTitle" class="font-bold">最近紀錄</h2>
          <button type="button" onclick="showPage('details')" class="min-h-[44px] px-2 font-bold text-[#754936]">查看明細</button>
        </div>
        <ul id="recentExpenses"></ul>
      </section>
    </div>

    <div id="page-entry" hidden>
        <!-- 區塊 3：記帳輸入手帳卡 (UI-03 大留白表單 + icons/image5.png 皮革手帳與鋼筆) -->
        <section class="bento-box p-5" aria-label="新增支出表單">
          <div class="flex justify-between items-center mb-4 pb-3 techo-divider border-t-0 border-b">
            <div class="flex items-center space-x-2.5">
              <!-- UI-01 3D 黏土旅行手帳與鋼筆圖示 (icons/image5.png) -->
              <span class="w-11 h-11 clay-icon-sm flex-shrink-0">
                <img src="icons/image5.png" alt="新增支出手帳圖示">
              </span>
              <!-- 標題 24px 規範 -->
              <h2 class="text-[24px] font-extrabold text-[#4D463C]">新增支出</h2>
            </div>
            <span id="formDayBadge" class="washi-badge text-[15px] font-bold px-3 py-1 rounded-lg">
              歸屬：Day 1
            </span>
          </div>

          <form id="expenseForm" onsubmit="addExpense(event)" class="space-y-4">
            <!-- 歸屬行程天數選擇 -->
            <div>
              <label for="inputDaySelect" class="block text-[16px] text-[#4D463C] font-bold mb-1.5">行程天數</label>
              <div class="relative">
                <select id="inputDaySelect" class="w-full techo-field px-3.5 font-bold appearance-none cursor-pointer">
                  <!-- 動態生成天數選項 -->
                </select>
                <span aria-hidden="true" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-sm text-[#806B5D] pointer-events-none">⌄</span>
              </div>
            </div>

            <!-- 金額與分類下拉選單 (Bento 雙欄比例) -->
            <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
              <div class="sm:col-span-3">
                <label for="inputAmount" class="block text-[16px] text-[#4D463C] font-bold mb-1.5">消費金額</label>
                <div class="relative">
                  <span id="formCurrPrefix" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[17px] font-extrabold text-[#754936]">NT$</span>

  <script>
    // UI-01 3D 黏土療癒色票、icons/ 圖檔路徑與 UI-03 日系草本手帳分類設定
    const CATEGORIES = {
      food: {
        name: '餐飲',
        icon: '🍜',
        img: 'icons/image7.png',
        color: '#D89B84',
        clayBg: 'linear-gradient(145deg, #F9E5DC 0%, #E6BFA9 100%)'
      },
      traffic: {
        name: '交通',
        icon: '🚅',
        img: 'icons/image8.png',
        color: '#91634F',
        clayBg: 'linear-gradient(145deg, #F5E8DC 0%, #CDA58E 100%)'
      },
      hotel: {
        name: '住宿',
        icon: '🏨',
        img: 'icons/image9.png',
        color: '#C7A98C',
        clayBg: 'linear-gradient(145deg, #F5ECE2 0%, #DEC6AE 100%)'
      },
      ticket: {
        name: '門票娛樂',
        icon: '🎟️',
        img: 'icons/image10.png',
        color: '#D49BA7',
        clayBg: 'linear-gradient(145deg, #F9E6EA 0%, #E5BDC6 100%)'
      },
      shopping: {
        name: '購物',
        icon: '🛍️',
        img: 'icons/image11.png',
        color: '#B88D76',
        clayBg: 'linear-gradient(145deg, #F1E4D9 0%, #D6B49F 100%)'
      },
      other: {
        name: '其他',
        icon: '💡',
        img: 'icons/image12.png',
        color: '#B5A899',
        clayBg: 'linear-gradient(145deg, #F0ECE6 0%, #D5CBBF 100%)'
      }
    };

    function chooseCategory(catKey) {
      const catSelect = document.getElementById('inputCategory');
      if (catSelect) {
        catSelect.value = catKey;
      }
      syncCategoryPicker(catKey);
    }

    function syncCategoryPicker(catKey) {
      const buttons = document.querySelectorAll('#categoryClayGrid [data-cat]');
      buttons.forEach(btn => {
        if (btn.getAttribute('data-cat') === catKey) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    let state = {
      currency: 'NT$',
      members: 2,
      roundMode: 'ceil',
      totalDays: 3,
      currentDayFilter: 0,
      expenses: []
    };

    let chartInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      document.getElementById('currencySelect').value = state.currency;
      document.getElementById('memberCount').textContent = state.members;
      document.getElementById('roundMode').value = state.roundMode;
      updateCurrencyLabels();
      renderDayTabs();
      renderDaySelectOptions();
      renderDashboard();
      renderExpenses();
    });

    function showPage(page) {
      const changed = document.getElementById(`page-${page}`).hidden;
      document.querySelectorAll('.bottom-nav [data-page]').forEach(button => {
        const active = button.dataset.page === page;
        document.getElementById(`page-${button.dataset.page}`).hidden = !active;
        if (active) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      document.getElementById('homeTravelBanner').hidden = page !== 'home';
      if (page === 'stats') updateChart();
      if (changed) window.scrollTo(0, 0);
    }

    function saveState() {
      localStorage.setItem('tripsplit_multi_data', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('tripsplit_multi_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
          if (!state.totalDays || state.totalDays < 1) state.totalDays = 3;
          state.expenses.forEach(item => {
            if (!item.day) item.day = 1;
          });
        } catch (e) {
          console.error(e);
        }
      }
    }

    function addDay() {
      state.totalDays += 1;
      state.currentDayFilter = state.totalDays;
      saveState();
      renderDayTabs();
      renderDaySelectOptions();
      renderDashboard();
      renderExpenses();
      updateChart();
    }

    function deleteCurrentDay() {
      if (state.currentDayFilter === 0) return;
      const targetDay = state.currentDayFilter;
      const count = state.expenses.filter(i => i.day === targetDay).length;

      const confirmMsg = count > 0
        ? `確定要刪除 Day ${targetDay} 嗎？該天的 ${count} 筆記帳將一併刪除！`
        : `確定要刪除 Day ${targetDay} 嗎？`;

      if (confirm(confirmMsg)) {
        state.expenses = state.expenses.filter(i => i.day !== targetDay);
        state.expenses.forEach(i => {
          if (i.day > targetDay) i.day -= 1;
        });
        state.totalDays = Math.max(1, state.totalDays - 1);
        state.currentDayFilter = Math.min(targetDay, state.totalDays);
        saveState();
        renderDayTabs();
        renderDaySelectOptions();
        renderDashboard();
        renderExpenses();
        updateChart();
      }
    }

    function selectDay(dayNumber) {
      state.currentDayFilter = dayNumber;
      saveState();
      renderDayTabs();
      renderDashboard();
      renderExpenses();
      updateChart();

      const inputDaySelect = document.getElementById('inputDaySelect');
      if (dayNumber > 0 && inputDaySelect) {
        inputDaySelect.value = dayNumber;
        document.getElementById('formDayBadge').textContent = `歸屬：Day ${dayNumber}`;
      }
    }

    function renderDayTabs() {
      const container = document.getElementById('dayTabsContainer');
      const delBtn = document.getElementById('btnDeleteDay');

      if (state.currentDayFilter > 0 && state.totalDays > 1) {
        delBtn.classList.remove('hidden');
      } else {
        delBtn.classList.add('hidden');
      }

      let tabsHtml = '';
      const isAllActive = state.currentDayFilter === 0;
      tabsHtml += `
        <button onclick="selectDay(0)" aria-pressed="${isAllActive}" class="btn-press min-h-[44px] px-4 py-2 rounded-2xl text-[16px] font-bold whitespace-nowrap transition-all ${
          isAllActive
            ? 'bg-[#754936] text-white shadow-md shadow-[#754936]/20'
            : 'bg-[#FAF4EB] text-[#4D463C] hover:bg-[#E9D9CA] border border-[#E9D9CA]'
        }">
          全部天數
        </button>
      `;

      for (let d = 1; d <= state.totalDays; d++) {
        const isActive = state.currentDayFilter === d;
        const dayTotal = state.expenses.filter(i => i.day === d).reduce((s, i) => s + i.amount, 0);
        tabsHtml += `
          <button onclick="selectDay(${d})" aria-pressed="${isActive}" class="btn-press min-h-[44px] px-4 py-2 rounded-2xl text-[16px] font-bold whitespace-nowrap transition-all flex items-center space-x-2 ${
            isActive
              ? 'bg-[#754936] text-white shadow-md shadow-[#754936]/20'
              : 'bg-[#FAF4EB] text-[#4D463C] hover:bg-[#E9D9CA] border border-[#E9D9CA]'
          }">
            <span>第 ${d} 天</span>
            ${dayTotal > 0 ? `<span class="text-[13px] px-2 py-0.5 rounded-full ${isActive ? 'bg-[#623A2B] text-[#FAF4EB]' : 'bg-[#FFFFFF] text-[#754936] border border-[#E9D9CA]'}">${formatShortAmount(dayTotal)}</span>` : ''}
          </button>
        `;
      }

      const scrollLeft = container.scrollLeft;
      container.innerHTML = tabsHtml;
      container.scrollLeft = scrollLeft;
      const selected = container.querySelector('[aria-pressed="true"]');
      const bounds = container.getBoundingClientRect();
      const selectedBounds = selected?.getBoundingClientRect();
      if (selectedBounds && selectedBounds.right > bounds.right) {
        container.scrollLeft += selectedBounds.right - bounds.right;
      } else if (selectedBounds && selectedBounds.left < bounds.left) {
        container.scrollLeft -= bounds.left - selectedBounds.left;
      }
    }

    function formatShortAmount(num) {
      if (num >= 10000) return (num / 1000).toFixed(0) + 'k';
      return num.toLocaleString();
    }

    function renderDaySelectOptions() {
      const select = document.getElementById('inputDaySelect');
      let options = '';
      for (let d = 1; d <= state.totalDays; d++) {
        options += `<option value="${d}">第 ${d} 天 (Day ${d})</option>`;
      }
      select.innerHTML = options;
      if (state.currentDayFilter > 0) {
        select.value = state.currentDayFilter;
        document.getElementById('formDayBadge').textContent = `歸屬：Day ${state.currentDayFilter}`;
      } else {
        select.value = 1;
        document.getElementById('formDayBadge').textContent = `歸屬：Day 1`;
      }

      select.onchange = (e) => {
        document.getElementById('formDayBadge').textContent = `歸屬：Day ${e.target.value}`;
      };
    }

    function updateMembers(delta) {
      const next = state.members + delta;
      if (next >= 1) {
        state.members = next;
        document.getElementById('memberCount').textContent = next;
        saveState();
        renderDashboard();
      }
    }

    function changeCurrency(val) {
      state.currency = val;
      updateCurrencyLabels();
      saveState();
      renderDashboard();
      renderExpenses();
    }

    function updateCurrencyLabels() {
      document.getElementById('currSymbol').textContent = state.currency;
      document.getElementById('currSymbolSub').textContent = state.currency;
      document.getElementById('formCurrPrefix').textContent = state.currency;
    }

    function getCurrentExpenses() {
      if (state.currentDayFilter === 0) {
        return state.expenses;
      }
      return state.expenses.filter(i => i.day === state.currentDayFilter);
    }

    function addExpense(e) {
      e.preventDefault();
      const amountInput = document.getElementById('inputAmount');
      const titleInput = document.getElementById('inputTitle');
      const catInput = document.getElementById('inputCategory');
      const payerInput = document.getElementById('inputPayer');
      const daySelect = document.getElementById('inputDaySelect');

      const amount = parseFloat(amountInput.value);
      if (isNaN(amount) || amount <= 0) return;

      const chosenDay = parseInt(daySelect.value) || 1;

      const newExpense = {
        id: Date.now().toString(),
        day: chosenDay,
        title: titleInput.value.trim() || '未命名消費',
        amount: amount,
        category: catInput.value,
        payer: payerInput.value.trim() || '公費錢包',
        date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      };

      state.expenses.unshift(newExpense);
      saveState();

      amountInput.value = '';
      titleInput.value = '';
      amountInput.blur();

      renderDayTabs();
      renderDashboard();
      renderExpenses();
      updateChart();
    }

    function deleteExpense(id) {
      if (confirm('確定要刪除這筆開銷嗎？')) {
        state.expenses = state.expenses.filter(item => item.id !== id);
        saveState();
        renderDayTabs();
        renderDashboard();
        renderExpenses();
        updateChart();
      }
    }

    function clearAllData() {
      if (confirm('確定要清空所有行程與記帳資料嗎？（此動作無法復原）')) {
        state.expenses = [];
        state.totalDays = 3;
        state.currentDayFilter = 0;
        saveState();
        renderDayTabs();
        renderDaySelectOptions();
        renderDashboard();
        renderExpenses();
        updateChart();
      }
    }

    function renderDashboard() {
      state.roundMode = document.getElementById('roundMode').value;
      const activeList = getCurrentExpenses();
      const total = activeList.reduce((sum, item) => sum + item.amount, 0);
      document.getElementById('totalAmount').textContent = total.toLocaleString('zh-TW');

      const recentExpenses = document.getElementById('recentExpenses');
      recentExpenses.innerHTML = activeList.slice(0, 2).map(item => {
        const category = CATEGORIES[item.category] || CATEGORIES.other;
        return `<li class="recent-expense">
          <img src="${category.img}" alt="${category.name}">
          <span class="truncate">${escapeHtml(item.title)}</span>
          <strong>${escapeHtml(state.currency)} ${item.amount.toLocaleString('zh-TW')}</strong>
        </li>`;
      }).join('') || '<li class="pb-2 text-sm">目前尚無支出記錄</li>';

      let perPerson = total / (state.members || 1);
      let displayPerPerson = 0;

      if (state.roundMode === 'ceil') {
        displayPerPerson = Math.ceil(perPerson);
      } else if (state.roundMode === 'floor') {
        displayPerPerson = Math.floor(perPerson);
      } else if (state.roundMode === 'round') {
        displayPerPerson = Math.round(perPerson);
      } else {
        displayPerPerson = perPerson.toFixed(1);
      }

      document.getElementById('perPersonAmount').textContent = displayPerPerson.toLocaleString('zh-TW');
      document.getElementById('recordCount').textContent = activeList.length;
    }

    function renderExpenses() {
      const container = document.getElementById('expenseList');
      const catFilter = document.getElementById('filterCategory').value;
      let list = getCurrentExpenses();

      if (catFilter !== 'all') {
        list = list.filter(i => i.category === catFilter);
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 px-4 bg-[#FAF4EB] rounded-2xl border-2 border-dashed border-[#E9D9CA]">
            <div class="w-16 h-16 mx-auto mb-3 clay-icon">
              <img src="icons/image5.png" alt="尚無支出記錄">
            </div>
            <p class="text-[18px] font-bold text-[#4D463C]">${state.currentDayFilter === 0 ? '目前尚無支出記錄' : `Day ${state.currentDayFilter} 尚無支出記錄`}</p>
            <p class="text-[16px] text-[#806B5D] mt-1">可在「記帳」新增旅行花費。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => {
        const cat = CATEGORIES[item.category] || CATEGORIES.other;
        return `
          <div class="bento-cell bg-[#FFFFFF] p-2 flex items-center justify-between gap-2 border border-[#E9D9CA] shadow-sm hover:border-[#B88D76] transition-colors">
            <div class="flex items-center gap-2 min-w-0">
              <!-- UI-01 3D 黏土分類圖示 (icons/image7.png ~ image12.png) -->
              <div class="w-9 h-9 clay-icon flex-shrink-0">
                <img src="${cat.img}" alt="${cat.name}">
              </div>
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-1">
                  <span class="text-[13px] font-extrabold px-2 py-0.5 bg-[#E5C7B1] text-[#754936] rounded-md border border-[#B88D76] flex-shrink-0">Day ${item.day}</span>
                  <div class="font-bold text-[16px] text-[#4D463C] break-all">${escapeHtml(item.title)}</div>
                </div>
                <div class="text-sm text-[#806B5D] flex flex-wrap items-center gap-1 mt-1 font-medium">
                  <span>${escapeHtml(item.payer)}</span>
                  <span>•</span>
                  <span>${item.date}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center space-x-2 flex-shrink-0">
              <div class="text-right">
                <div class="font-extrabold text-[16px] text-[#754936]">${state.currency} ${item.amount.toLocaleString()}</div>
                <div class="text-[14px] text-[#806B5D] font-bold">${cat.name}</div>
              </div>
              <button onclick="deleteExpense('${item.id}')" class="btn-press min-w-[44px] min-h-[44px] rounded-xl text-[#8C8274] hover:text-[#913D2D] hover:bg-[#F9EAE4] flex items-center justify-center transition-colors" aria-label="刪除此筆支出">
                <span aria-hidden="true" class="text-base">×</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function initChart() {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: [],
            borderWidth: 3,
            borderColor: '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                boxWidth: 14,
                padding: 12,
                color: '#4D463C',
                font: { size: 14, weight: 'bold' }
              }
            }
          },
          cutout: '66%'
        }
      });
    }

    function updateChart() {
      if (document.getElementById('page-stats').hidden) return;
      const activeList = getCurrentExpenses();
      const hasExpenses = activeList.length > 0;
      const canDraw = hasExpenses && typeof Chart !== 'undefined';
      const chartMessage = document.getElementById('chartEmpty');
      chartMessage.hidden = canDraw;
      chartMessage.textContent = hasExpenses ? '圖表載入失敗' : '目前尚無支出記錄';
      document.getElementById('chartPlot').hidden = !canDraw;
      document.getElementById('chartDayLabel').textContent =
        state.currentDayFilter === 0 ? '全部天數' : `第 ${state.currentDayFilter} 天`;
      const total = activeList.reduce((sum, item) => sum + item.amount, 0);
      document.getElementById('chartTotalBadge').textContent =
        hasExpenses ? `${state.currency} ${total.toLocaleString('zh-TW')}` : '';
      if (!canDraw) return;
      if (!chartInstance) initChart();

      const sums = {};
      activeList.forEach(i => {
        sums[i.category] = (sums[i.category] || 0) + i.amount;
      });

      const labels = [];
      const data = [];
      const colors = [];

      Object.keys(sums).forEach(key => {
        if (sums[key] > 0) {
          labels.push(CATEGORIES[key].name);
          data.push(sums[key]);
          colors.push(CATEGORIES[key].color);
        }
      });

      chartInstance.data.labels = labels;
      chartInstance.data.datasets[0].data = data;
      chartInstance.data.datasets[0].backgroundColor = colors;
      chartInstance.update();
    }

    function openShareModal() {
      document.getElementById('copyBtnText').textContent = '一鍵複製報告';
      const select = document.getElementById('shareScopeSelect');
      let options = `<option value="all">全部行程總結算 (Day 1 ~ Day ${state.totalDays})</option>`;
      for (let d = 1; d <= state.totalDays; d++) {
        options += `<option value="${d}">僅 Day ${d} 結算</option>`;
      }
      select.innerHTML = options;
      select.value = state.currentDayFilter === 0 ? 'all' : state.currentDayFilter.toString();

      generateShareText();
      document.getElementById('shareModal').classList.remove('hidden');
      document.getElementById('shareModal').classList.add('flex');
    }

    function generateShareText() {
      const scope = document.getElementById('shareScopeSelect').value;
      let targetExpenses = [];
      let headerTitle = '';

      if (scope === 'all') {
        targetExpenses = state.expenses;
        headerTitle = `✈️【旅行記帳・全行程結算清單】`;
      } else {
        const d = parseInt(scope);
        targetExpenses = state.expenses.filter(i => i.day === d);
        headerTitle = `✈️【旅行記帳・Day ${d} 當日結算清單】`;
      }

      const total = targetExpenses.reduce((sum, item) => sum + item.amount, 0);
      let perPerson = total / (state.members || 1);
      if (state.roundMode === 'ceil') perPerson = Math.ceil(perPerson);
      else if (state.roundMode === 'floor') perPerson = Math.floor(perPerson);
      else if (state.roundMode === 'round') perPerson = Math.round(perPerson);
      else perPerson = perPerson.toFixed(1);

      let text = `${headerTitle}\n`;
      text += `---------------------------\n`;
      text += `💰 結算總額：${state.currency} ${total.toLocaleString()}\n`;
      text += `👥 分攤人數：${state.members} 人\n`;
      text += `👉 每人應付：${state.currency} ${perPerson.toLocaleString()}\n`;
      text += `---------------------------\n`;
      text += `📋 詳細消費明細：\n`;

      if (targetExpenses.length === 0) {
        text += `(尚無支出記錄)\n`;
      } else {
        if (scope === 'all') {
          for (let d = 1; d <= state.totalDays; d++) {
            const dayItems = targetExpenses.filter(i => i.day === d);
            if (dayItems.length > 0) {
              const daySubtotal = dayItems.reduce((s, i) => s + i.amount, 0);
              text += `\n【Day ${d}】(小計: ${state.currency} ${daySubtotal.toLocaleString()})\n`;
              dayItems.forEach((item, idx) => {
                const cat = CATEGORIES[item.category] || CATEGORIES.other;
                text += `  • [${cat.name}] ${item.title} : ${state.currency} ${item.amount.toLocaleString()} (${item.payer})\n`;
              });
            }
          }
        } else {
          targetExpenses.forEach((item, idx) => {
            const cat = CATEGORIES[item.category] || CATEGORIES.other;
            text += `${idx + 1}. [${cat.name}] ${item.title} : ${state.currency} ${item.amount.toLocaleString()} (${item.payer})\n`;
          });
        }
      }

      text += `\n結算生成於 TripSplit 旅帳通`;
      document.getElementById('shareTextPreview').value = text;
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.add('hidden');
      document.getElementById('shareModal').classList.remove('flex');
    }

    async function copyShareText() {
      const textarea = document.getElementById('shareTextPreview');
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      const btnText = document.getElementById('copyBtnText');
      try {
        await navigator.clipboard.writeText(textarea.value);
      } catch {
        textarea.focus();
        textarea.select();
        btnText.textContent = '請手動複製已選取文字';
        return;
      }
      btnText.textContent = '已成功複製！';
      setTimeout(() => {
        btnText.textContent = '一鍵複製報告';
        closeShareModal();
      }, 1200);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
